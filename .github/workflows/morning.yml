# Morning reminders: every hour, ask GeoQuest to nudge the players whose chosen time it is (in
# their own time zone). Free on GitHub; Vercel's free plan only runs scheduled jobs once a day.
# Needs the CRON_SECRET repository secret (Settings → Secrets and variables → Actions), the same
# value as CRON_SECRET in Vercel.
name: Morning reminders

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the morning reminders that are due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET isn't set yet — skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            https://playgeoquest.app/api/cron/morning
