<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeoQuest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#04060f" />
    <meta name="robots" content="noindex" />
    <title>Sign in — GeoQuest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Self-contained on purpose: everything else on the site needs a session. -->
    <style>
      :root { --gold: #fbbf24; --gold-soft: #fde68a; --text: #e8edf7; --muted: #94a3b8; --dim: #64748b; --line: rgba(148, 163, 184, 0.18); --ease: cubic-bezier(0.16, 1, 0.3, 1); }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #03050d; color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
      body { min-height: 100vh; min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
        background: radial-gradient(circle at 50% 30%, #0b1430, #03050d 70%); overflow-x: hidden; }
      /* a field of slow stars */
      body::before { content: ''; position: fixed; inset: -50%; pointer-events: none; opacity: 0.55;
        background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #cbd5e1, transparent),
          radial-gradient(1.5px 1.5px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 85% 15%, #e2e8f0, transparent),
          radial-gradient(1px 1px at 10% 70%, #fff, transparent), radial-gradient(1.2px 1.2px at 55% 20%, #f8fafc, transparent);
        background-size: 360px 360px; animation: drift 120s linear infinite; }
      @keyframes drift { to { transform: translate(180px, 90px); } }

      .card { position: relative; width: min(380px, 100%); padding: 28px 26px 24px; border-radius: 24px;
        background: rgba(9, 14, 30, 0.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px rgba(0, 0, 0, 0.8);
        animation: rise 0.7s var(--ease) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.98); } }

      .stage { position: relative; width: 120px; height: 118px; margin: -6px auto 4px; }
      .hop { position: absolute; left: 50%; bottom: 20px; width: 74px; height: 74px; margin-left: -37px; transform-origin: 50% 100%; animation: hop 1.25s infinite; }
      @keyframes hop {
        0% { transform: translateY(0) scale(1.08, 0.9); animation-timing-function: cubic-bezier(0.2, 0.7, 0.4, 1); }
        12% { transform: translateY(-6px) scale(0.96, 1.05); animation-timing-function: cubic-bezier(0.2, 0.6, 0.35, 1); }
        50% { transform: translateY(-30px) scale(1, 1); animation-timing-function: cubic-bezier(0.6, 0, 0.8, 0.45); }
        88% { transform: translateY(-3px) scale(0.97, 1.03); animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1); }
        100% { transform: translateY(0) scale(1.08, 0.9); }
      }
      .earth { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
        background: #1d4ed8 url(/textures/loader-earth.jpg) 0 50% / auto 100% repeat-x; animation: spin 5s linear infinite;
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.25), 0 0 28px rgba(56, 189, 248, 0.45), 0 0 70px rgba(56, 189, 248, 0.16); }
      @keyframes spin { to { background-position: -148px 50%; } }
      .earth::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.35), rgba(255,255,255,0) 38%), radial-gradient(circle at 42% 38%, rgba(0,0,0,0) 36%, rgba(2,6,23,0.5) 70%, rgba(2,6,23,0.95) 100%); }
      .shadow { position: absolute; left: 50%; bottom: 10px; width: 66px; height: 12px; margin-left: -33px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(56,189,248,0.38), rgba(56,189,248,0.08) 70%, transparent); filter: blur(2px); animation: shadow 1.25s infinite; }
      @keyframes shadow { 0% { transform: scale(1.1, 1); opacity: 1; } 50% { transform: scale(0.55, 0.7); opacity: 0.35; } 100% { transform: scale(1.1, 1); opacity: 1; } }

      h1 { margin: 0; text-align: center; font: 700 26px/1.2 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.01em; }
      .sub { margin: 4px 0 22px; text-align: center; color: var(--muted); font-size: 14px; }

      form { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
      .field { position: relative; display: flex; align-items: center; height: 44px; border-radius: 12px;
        background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.2s; }
      .field:focus-within { box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.6), 0 0 0 3px rgba(251, 191, 36, 0.14); }
      input { flex: 1; min-width: 0; height: 100%; padding: 0 14px; border: 0; outline: none; background: none; color: var(--text); font: 500 16px Inter, sans-serif; }
      input::placeholder { color: var(--dim); }
      .peek { height: 100%; padding: 0 12px; border: 0; background: none; color: var(--muted); font: 500 12px Inter, sans-serif; cursor: pointer; border-radius: 0 12px 12px 0; }
      .peek:hover { color: var(--text); }
      button.go { margin-top: 6px; height: 46px; border: 0; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        font: 600 15px 'Space Grotesk', Inter, sans-serif; color: #1a1205; background: linear-gradient(135deg, var(--gold-soft), var(--gold));
        box-shadow: 0 10px 30px -10px rgba(251, 191, 36, 0.7); transition: transform 0.15s, filter 0.15s, opacity 0.2s; }
      button.go:hover { transform: translateY(-1px); }
      button.go:active { transform: translateY(0) scale(0.99); filter: brightness(0.92); }
      button.go:disabled { opacity: 0.7; cursor: default; transform: none; }
      .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(26, 18, 5, 0.25); border-top-color: #1a1205; animation: rot 0.8s linear infinite; display: none; }
      button.busy .spinner { display: block; }
      @keyframes rot { to { transform: rotate(360deg); } }
      :where(button, input):focus-visible { outline: 2px solid rgba(251, 191, 36, 0.75); outline-offset: 2px; }

      .error { min-height: 20px; margin: 2px 0 0; font-size: 13px; color: #fca5a5; text-align: center; }
      .shake { animation: shake 0.42s; }
      @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
      .foot { margin: 16px 0 0; text-align: center; font-size: 12px; color: var(--dim); }
      .note { margin: -8px 0 16px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; color: #fde68a;
        background: rgba(251, 191, 36, 0.08); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.22); text-align: center; }
      .note a { color: #fbbf24; font-weight: 600; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .hop, .shadow, .earth, body::before, .card { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="stage" aria-hidden="true"><div class="hop"><div class="earth"></div></div><div class="shadow"></div></div>
      <h1 id="title">GeoQuest</h1>
      <p class="sub" id="sub">Sign in to explore the world</p>
      <p class="note" id="note" hidden></p>
      <form id="form" novalidate>
        <label id="uLabel">Username
          <span class="field"><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus /></span>
        </label>
        <label>Password
          <span class="field"><input id="p" name="password" type="password" autocomplete="current-password" required /><button type="button" class="peek" id="peek" aria-label="Show password">Show</button></span>
        </label>
        <label id="p2Label" hidden>Repeat password
          <span class="field"><input id="p2" name="password2" type="password" autocomplete="new-password" /></span>
        </label>
        <button class="go" id="go" type="submit"><span class="spinner" aria-hidden="true"></span><span id="goText">Sign in</span></button>
        <p class="error" id="err" role="alert"></p>
      </form>
      <p class="foot" id="foot">Accounts are created by invitation.</p>
    </main>
    <script>
      (function () {
        var $ = function (id) { return document.getElementById(id); };
        var form = $('form'), u = $('u'), p = $('p'), p2 = $('p2'), go = $('go'), goText = $('goText'), err = $('err');
        var card = $('card'), peek = $('peek'), note = $('note'), foot = $('foot');
        var q = new URLSearchParams(location.search);
        var mode = location.pathname === '/welcome' ? 'welcome' : location.pathname === '/setup' ? 'setup' : 'login';
        var label = { login: 'Sign in', welcome: 'Join GeoQuest', setup: 'Create owner account' }[mode];
        // Only ever return to a path on this site.
        var nxt = q.get('next') || '/';
        if (nxt.charAt(0) !== '/' || nxt.charAt(1) === '/' || nxt.charAt(1) === '\\') nxt = '/';

        function show(el, on) { el.hidden = !on; }
        function say(html) { note.innerHTML = html; show(note, !!html); }
        function lock(msg) { show(form, false); say(msg); }
        function setBusy(b, text) { go.disabled = b; go.classList.toggle('busy', b); goText.textContent = text || label; }
        function fail(msg) {
          err.textContent = msg;
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          setBusy(false);
        }
        function getJSON(url) { return fetch(url, { credentials: 'same-origin' }).then(function (r) { return r.json(); }); }
        var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

        setBusy(false);
        if (mode !== 'login') {
          show($('p2Label'), true);
          p.setAttribute('autocomplete', 'new-password');
          p.placeholder = 'At least 8 characters';
        }

        if (mode === 'login' && q.get('ready')) say('Your owner account is ready — sign in with it here.');
        else if (mode === 'login') {
          getJSON('/api/setup').then(function (d) {
            if (d.needsSetup) say('GeoQuest isn’t set up yet.' + (d.setupUrl ? ' Owner? <a href="' + esc(d.setupUrl) + '">Finish setup →</a>' : ''));
          }).catch(function () {});
        }

        if (mode === 'welcome') {
          $('title').textContent = 'You’re invited!';
          $('sub').textContent = 'Choose a password to join GeoQuest';
          foot.textContent = 'Your password is yours alone — nobody else ever sees it.';
          u.value = q.get('u') || ''; u.readOnly = true; u.removeAttribute('autofocus');
          getJSON('/api/invite?u=' + encodeURIComponent(q.get('u') || '') + '&t=' + encodeURIComponent(q.get('t') || ''))
            .then(function (d) {
              if (!d.valid) lock('This invite link has expired or was already used. Ask the person who invited you for a fresh one — or <a href="/login">sign in</a> if you’ve already joined.');
              else p.focus();
            })
            .catch(function () { lock('Couldn’t check this invite — check your connection and reload.'); });
        }

        if (mode === 'setup') {
          $('title').textContent = 'Set up GeoQuest';
          $('sub').textContent = 'Create the owner account — you’ll invite everyone else from the app';
          foot.textContent = 'Only reachable from your Vercel-protected link.';
          getJSON('/api/setup').then(function (d) {
            if (!d.needsSetup) lock('GeoQuest is already set up. <a href="/login">Sign in →</a>');
            else if (!d.allowedHere) lock('For security, open setup from your Vercel-protected link' + (d.setupUrl ? ': <a href="' + esc(d.setupUrl) + '">' + esc(d.setupUrl) + '</a>' : '.'));
          }).catch(function () { lock('Couldn’t reach the server — reload to try again.'); });
        }

        peek.addEventListener('click', function () {
          var showPw = p.type === 'password';
          p.type = p2.type = showPw ? 'text' : 'password';
          peek.textContent = showPw ? 'Hide' : 'Show';
          peek.setAttribute('aria-label', showPw ? 'Hide password' : 'Show password');
          p.focus();
        });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          if (!u.value.trim() || !p.value) { fail(mode === 'login' ? 'Enter your username and password.' : 'Choose a username and password.'); (u.value.trim() ? p : u).focus(); return; }
          if (mode !== 'login') {
            if (p.value.length < 8) { fail('Use at least 8 characters.'); p.focus(); return; }
            if (p.value !== p2.value) { fail('The passwords don’t match.'); p2.focus(); return; }
          }
          err.textContent = '';
          setBusy(true, mode === 'login' ? 'Signing in…' : 'Setting up…');
          var url = mode === 'login' ? '/api/login' : mode === 'welcome' ? '/api/invite/accept' : '/api/setup';
          var payload = { username: u.value.trim(), password: p.value };
          if (mode === 'welcome') payload.token = q.get('t') || '';
          fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify(payload) })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; }); })
            .then(function (x) {
              if (x.ok) { goText.textContent = 'Welcome!'; location.replace(mode === 'login' ? nxt : (x.d.next || '/')); return; }
              fail(x.d.error || 'Something went wrong — try again.');
              if (mode === 'login' && x.d.error && /password/i.test(x.d.error)) p.select();
            })
            .catch(function () { fail('Couldn’t reach the server — check your connection.'); });
        });
      })();
    </script>
  </body>
</html>
