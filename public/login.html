<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GeoQuest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#04060f" />
    <meta name="robots" content="noindex" />
    <title>GeoQuest — Sign in or create an account</title>
    <!-- Link previews (WhatsApp, iMessage, Telegram…) for invite links -->
    <meta name="description" content="You’re invited to GeoQuest — explore a 3D globe, take the daily challenge and play live geography games with friends." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoQuest" />
    <meta property="og:title" content="You’re invited to GeoQuest 🌍" />
    <meta property="og:description" content="Explore a 3D globe, take the daily challenge and play live geography games with friends." />
    <meta property="og:image" content="https://playgeoquest.app/icons/og-invite.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- Self-contained on purpose: the sign-in page loads nothing from the app. -->
    <style>
      :root { --gold: #fbbf24; --gold-soft: #fde68a; --text: #eef2fa; --muted: #93a1b8; --dim: #5f6d84; --line: rgba(148, 163, 184, 0.16); --field: rgba(255, 255, 255, 0.045); --ease: cubic-bezier(0.16, 1, 0.3, 1); }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #03050d; color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow-x: hidden;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(18px + env(safe-area-inset-left, 0px));
        background: radial-gradient(700px 520px at 50% 34%, rgba(37, 99, 235, 0.18), transparent 70%), #03050d; }
      body::before { content: ''; position: fixed; inset: -50%; pointer-events: none; opacity: 0.45;
        background-image: radial-gradient(1px 1px at 20% 30%, #fff, transparent), radial-gradient(1px 1px at 70% 60%, #cbd5e1, transparent),
          radial-gradient(1.4px 1.4px at 40% 80%, #fff, transparent), radial-gradient(1px 1px at 85% 15%, #e2e8f0, transparent),
          radial-gradient(1px 1px at 10% 70%, #fff, transparent), radial-gradient(1.2px 1.2px at 55% 20%, #f8fafc, transparent);
        background-size: 380px 380px; animation: drift 140s linear infinite; }
      @keyframes drift { to { transform: translate(190px, 95px); } }
      a { color: var(--gold-soft); text-decoration: none; }

      .card { position: relative; width: min(360px, 100%); display: grid; justify-items: center; text-align: center; animation: rise 0.8s var(--ease) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

      .globe { position: relative; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; margin-bottom: 18px;
        background: #1d4ed8 url(/textures/loader-earth.jpg) 0 50% / auto 100% repeat-x; animation: spin 9s linear infinite;
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.22), 0 0 40px rgba(56, 189, 248, 0.45), 0 0 120px rgba(56, 189, 248, 0.18); }
      .globe::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.34), rgba(255,255,255,0) 38%), radial-gradient(circle at 42% 38%, rgba(0,0,0,0) 36%, rgba(2,6,23,0.5) 70%, rgba(2,6,23,0.95) 100%); }
      @keyframes spin { to { background-position: -192px 50%; } }
      h1 { margin: 0; font: 700 30px/1.1 'Space Grotesk', Inter, sans-serif; letter-spacing: -0.02em; }
      .sub { margin: 8px 0 28px; color: var(--muted); font-size: 14.5px; }
      .ctx { margin: -14px 0 22px; padding: 8px 14px; border-radius: 99px; font-size: 13px; color: var(--gold-soft); background: rgba(251, 191, 36, 0.08); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.22); }

      form { width: 100%; display: grid; gap: 10px; text-align: left; }
      .field { position: relative; display: flex; align-items: center; height: 50px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow 0.2s, background 0.2s; }
      .field:focus-within { background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.55), 0 0 0 4px rgba(251, 191, 36, 0.1); }
      .field.ok::after { content: '✓'; position: absolute; right: 14px; color: #34d399; font-size: 14px; font-weight: 700; }
      input { flex: 1; min-width: 0; height: 100%; padding: 0 16px; border: 0; outline: none; background: none; color: var(--text); font: 500 16px Inter, sans-serif; border-radius: 14px; }
      input::placeholder { color: var(--dim); }
      input[readonly] { color: var(--muted); }
      /* Browser autofill: keep our dark field instead of a pale yellow/blue box */
      input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
        -webkit-text-fill-color: var(--text); caret-color: var(--text); -webkit-box-shadow: 0 0 0 100px #0c1222 inset; box-shadow: 0 0 0 100px #0c1222 inset; transition: background-color 9999s; }
      .peek { height: 100%; padding: 0 15px; border: 0; background: none; color: var(--dim); font: 500 12.5px Inter, sans-serif; cursor: pointer; border-radius: 0 14px 14px 0; }
      .peek:hover { color: var(--text); }

      button.go { margin-top: 8px; height: 50px; border: 0; border-radius: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        font: 600 15.5px 'Space Grotesk', Inter, sans-serif; color: #1a1205; background: linear-gradient(135deg, var(--gold-soft), var(--gold) 60%, #f59e0b);
        box-shadow: 0 14px 34px -14px rgba(251, 191, 36, 0.8); transition: transform 0.15s, filter 0.15s, opacity 0.2s; }
      button.go:hover { transform: translateY(-1px); filter: brightness(1.04); }
      button.go:active { transform: translateY(0) scale(0.99); filter: brightness(0.94); }
      button.go:disabled { opacity: 0.7; cursor: default; transform: none; }
      .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(26, 18, 5, 0.25); border-top-color: #1a1205; animation: rot 0.8s linear infinite; display: none; }
      button.busy .spinner { display: block; }
      @keyframes rot { to { transform: rotate(360deg); } }
      :where(button, input, a):focus-visible { outline: 2px solid rgba(251, 191, 36, 0.75); outline-offset: 2px; }
      .error { min-height: 20px; margin: 2px 0 0; font-size: 13px; color: #fca5a5; text-align: center; }
      .shake { animation: shake 0.42s; }
      @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

      .swap { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
      .swap button { padding: 0; border: 0; background: none; font: 600 14px Inter, sans-serif; color: var(--gold-soft); cursor: pointer; }
      .guest { margin-top: 22px; font-size: 13px; color: var(--dim); transition: color 0.2s; }
      .guest:hover { color: var(--text); }
      .note { width: 100%; margin: -10px 0 18px; font-size: 13px; line-height: 1.5; color: var(--gold-soft); }
      .note a { font-weight: 600; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: reduce) { .globe, body::before, .card { animation: none; } }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="globe" aria-hidden="true"></div>
      <h1 id="title">GeoQuest</h1>
      <p class="sub" id="sub">Sign in to play with friends</p>
      <p class="ctx" id="ctx" hidden></p>
      <p class="note" id="note" hidden></p>
      <form id="form" novalidate>
        <span class="field" id="uField"><input id="u" name="username" placeholder="Username" aria-label="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32" required /></span>
        <span class="field"><input id="p" name="password" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" maxlength="200" required /><button type="button" class="peek" id="peek" aria-label="Show password">Show</button></span>
        <span class="field" id="p2Label" hidden><input id="p2" name="password2" type="password" placeholder="Repeat password" aria-label="Repeat password" autocomplete="new-password" maxlength="200" /></span>
        <button class="go" id="go" type="submit"><span class="spinner" aria-hidden="true"></span><span id="goText">Sign in</span></button>
        <p class="error" id="err" role="alert"></p>
      </form>
      <p class="swap" id="swap"><span id="swapText">New to GeoQuest?</span> <button type="button" id="swapBtn">Create an account</button></p>
      <a class="guest" id="guest" href="/">Continue as a guest →</a>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
